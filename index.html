<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Starter — todos & notes</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="shell">
      <header class="top">
        <div>
          <p class="eyebrow">Starter app</p>
          <h1>Todos & notes</h1>
        </div>
        <p class="count" id="count" aria-live="polite"></p>
      </header>

      <form id="composer" class="composer" autocomplete="off">
        <label class="sr-only" for="title">New todo</label>
        <input id="title" name="title" type="text" placeholder="What needs doing?" required />
        <label class="sr-only" for="note">Optional note</label>
        <textarea id="note" name="note" rows="2" placeholder="Optional note"></textarea>
        <button type="submit">Add</button>
      </form>

      <nav class="filters" aria-label="Filter todos">
        <button type="button" data-filter="all" class="is-active">All</button>
        <button type="button" data-filter="open">Open</button>
        <button type="button" data-filter="done">Done</button>
      </nav>

      <ul id="list" class="list"></ul>
      <p id="empty" class="empty hidden">Nothing here yet. Add your first item above.</p>
    </div>
    <script src="app.js"></script>
  </body>
</html>
